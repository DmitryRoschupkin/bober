<!DOCTYPE html>
<html   xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org"
        lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Бобёр - великое издательство</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollSmoother.min.js"></script>


    <script th:src="@{/js/index.js}" defer></script>
    <script th:src="@{/js/header.js}" defer></script>
</head>
<body>

    <header th:replace="~{fragments/layout :: header(hero=true)}"></header>
    <div class="wrapper">
        <div class="content">
            <div class="main-header">
                <div class="layers">
                    <div class="layer__header">
                        <div class="layers__caption">
                            <img th:src="@{/img/light_bober.png}" alt="бобр лого газ" style="
                                max-height: 150px;
                                width: auto;
                            " class="logo_overlay">
                        </div>
                        <div class="layers__title">
                            est. 2022
                        </div>
                    </div>
                    <div class="layer layers__base"
                         th:style="'background-image: url(' + @{/img/back-bober.png} + ')'">
                    </div>
                    <div class="layer layers__middle"
                         th:style="'background-image: url(' + @{/img/mid-bober.png} + ')'">
                    </div>
                    <div class="layer layers__front"
                         th:style="'background-image: url(' + @{/img/front-bober.png} + ')'">
                    </div>
                </div>
            </div>
            <div class="main-article" th:style=" 'background-image: url(' + @{/img/van_gog.jpeg} + ')' ">
                <div class="main-article__content">
                    <h2 class="main-article__header">Великое издательство</h2>
                    <p class="main-article__paragraph">Статус. Известность. Бобёр.</p>
                    <a th:href="@{/books}" class="avg-btn"><p>К книгам!</p></a>
                </div>
                <footer th:replace="~{fragments/layout :: footer(hero=true)}"></footer>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
