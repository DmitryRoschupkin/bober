<!DOCTYPE html>
<html lang="en"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${author.firstName} + ' ' + ${author.lastName}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/listing.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/comment.css}">
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script th:src="@{/js/header.js}" defer></script>
    <script th:src="@{/js/image-modal.js}" defer></script>
    <script th:src="@{/js/post.js}" defer></script>
    <script th:src="@{/js/comment.js}" defer></script>

</head>
<body>
<div class="page">
    <header th:replace="~{fragments/layout::header(hero=false)}"></header>
    <div class="author-detail">
        <div class="author-detail__avatar">
            <div th:if="${author.user.userPicturePath}"
                 class="profile-card__avatar-pic">
                <img th:src="@{/files/{path}(path=${author.user.userPicturePath})}"
                     alt="userpic"
                     class="js-pic-preview">
            </div>
            <div th:unless="${author.user.userPicturePath}">
                <span style="text-transform: uppercase" th:text="${#strings.substring(author.user.firstName, 0, 1)}"></span>
            </div>
        </div>

        <div>
            <h1 class="author-detail__name"
                th:text="${author.firstName + ' ' + (author.lastName ?: '')}"></h1>

            <p class="author-detail__bio" th:if="${author.bio}" th:text="${author.bio}"></p>

            <div class="author-detail__stats">
                    <span>
                        <strong th:text="${booksAmount + ' ' + author.getWordCase(booksAmount)}"></strong>
                    </span>
                <span th:if="${author.birthDate != null}">
                        <strong th:text="${author.getAge()}"></strong> лет
                    </span>
            </div>

            <div class="author__subscribe">
                <form th:action="@{/authors/{id}/subscribe(id=${author.id})}"
                      method="post"
                      class="author__subscribe-form">
                    <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="author__subscribe-button"
                            th:classappend="${isSubscribed ? 'is-subscribed' : ''}">
                        <p class="author__subscribe-button-text"
                           th:text="${isSubscribed} ? 'Вы подписаны' : 'Подписаться'">Подписаться</p>
                        <p class="author__subscribe-button-counter" th:text="${subscribersCount}">0</p>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="author__content">
        <div class="author__books-listing">
            <h1 class="section-label">Великие творения великого автора</h1>

            <div class="author__books-grid">
                <a th:each="book: ${author.books}"
                   th:href="@{/books/{id}(id=${book.id})}"
                   class="author-book-card">
                    <div class="author-book-card__cover">
                        <img th:if="${book.coverPath}"
                             th:src="@{/files/{path}(path=${book.coverPath})}"
                             th:alt="${book.title}"
                             class="book-cover-img"/>
                        <!-- default cover will be designed soon -->
                        <img th:unless="${book.coverPath}"
                             th:src="@{/img/default-cover.png}"
                             alt="No cover"
                             class="book-cover-img"/>
                    </div>
                    <p class="book-card__title" th:text="${book.title}"></p>
                </a>
            </div>
        </div>
        <div class="author-microblog">
            <h1 class="section-label">Новости автора</h1>

            <div class="author-microblog__sort">
                <a th:href="@{/authors/{id}(id=${author.id}, sort='date', dir=${param.dir ?: 'desc'})}"
                   th:classappend="${param.sort == null or param.sort[0] == 'date' ? 'is-active' : ''}"
                   class="author-microblog__sort-tab">
                    По дате
                </a>

                <a th:href="@{/authors/{id}(id=${author.id}, sort='popularity', dir=${param.dir ?: 'desc'})}"
                   th:classappend="${param.sort != null and param.sort[0] == 'popularity' ? 'is-active' : ''}"
                   class="author-microblog__sort-tab">
                    По популярности
                </a>

                <a th:href="@{/authors/{id}(id=${author.id}, sort=${param.sort ?: 'date'}, dir=${param.dir != null and param.dir[0] == 'asc' ? 'desc' : 'asc'})}"
                   class="author-microblog__sort-tab reverse-dir-btn">
                    <span th:text="${param.dir != null and param.dir[0] == 'asc' ? 'Сортировка: По возрастанию' : 'Сортировка: По убыванию'}">
                        Сортировка: По убыванию
                    </span>
                </a>
            </div>


            <form class="author-microblog__form" th:if="${isOwner}" th:action="@{/authors/{id}/post(id=${author.id})}" method="post">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="text" name="title" class="author-microblog__input" placeholder="Тема (необязательно)">
                <input type="hidden" name="id" th:value="${author.id}">
                <textarea class="author-microblog-textarea author-microblog__input" name="text" placeholder="Что нового?"
                          required></textarea>
                <button type="submit" class="author-microblog__post-btn">Опубликовать</button>
            </form>

            <div class="author-microblog__posts-listing"
                 th:with="canDelete=${isOwner or #authorization.expression('hasAnyRole(''ADMIN'', ''SUDO'')')}">
                <div class="author-microblog__post"
                     th:each="post: ${posts}"
                     th:if="${!posts.isEmpty() && posts != null}"
                     th:id="'post-'+${post.id}">

                    <div class="author-microblog__post-metadata">
                        <p th:text="${author.firstName+' '+author.lastName}" class="author-microblog__post-fullname"></p>
                    </div>

                    <p th:if="${post.title != null && !post.title.isBlank()}"
                       th:text="${post.title}"
                       class="author-microblog__post-title"></p>
                    <p th:text="${post.text}"
                       class="author-microblog__post-text"></p>
                    <div class="author-microblog__post-marks">
                        <form th:action="@{/authors/{id}/post/mark(id=${author.id})}" method="post">
                            <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="isLike" value="true">
                            <input type="hidden" name="postId" th:value="${post.id}">
                            <button type="submit"
                                    class="author-microblog__post-mark post-btn-like"
                                    th:disabled="${currentUser == null}"
                                    th:classappend="${userPostMarks != null && userPostMarks[post.id] == true ? 'active' : ''}">
                                <i class="fa-solid fa-thumbs-up"></i>
                                <span class="author-microblog__post-marks-count"
                                      th:text="${post.likesCount ?: 0}">0</span>
                            </button>
                        </form>
                        <form th:action="@{/authors/{id}/post/mark(id=${author.id})}" method="post">
                            <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="isLike" value="false">
                            <input type="hidden" name="postId" th:value="${post.id}">
                            <button type="submit"
                                    class="author-microblog__post-mark post-btn-dislike"
                                    th:disabled="${currentUser == null}"
                                    th:classappend="${userPostMarks != null && userPostMarks[post.id] == false ? 'active' : ''}">
                                <i class="fa-solid fa-thumbs-down"></i>
                                <span class="author-microblog__post-marks-count"
                                      th:text="${post.dislikesCount ?: 0}">0</span>
                            </button>
                        </form>
                        <button type="button"
                                class="author-microblog__post-mark comments-btn">
                            <i class="fa-solid fa-message"></i>
                            <span class="author-microblog__post-marks-count" th:text="${post.getCommentsAmount()}"></span>
                        </button>
                        <div class="author-microblog__post-date">
                            <p class="author-microblog__post-created"
                               th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}"></p>
                            <p  class="author-microblog__post-updated"
                                th:if="${post.updatedAt != null &&
                                    post.updatedAt != post.createdAt}"
                                th:title="${#temporals.format(post.updatedAt, 'dd.MM.yyyy HH:mm')}"
                                th:text="'(изменено)'"></p>
                        </div>
                    </div>
                    <div class="author-microblog__post-actions">
                        <button type="button"
                                class="author-microblog__post-edit-btn"
                                th:if="${isOwner}">
                            Редактировать пост
                        </button>
                        <form th:if="${canDelete}"
                              th:action="@{/authors/posts/{postId}/delete(postId=${post.id})}"
                              method="post"
                              onsubmit="return confirm('Вы уверены, что хотите удалить этот пост?');">
                            <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="authorId" th:value="${post.author.id}" />
                            <button type="submit" class="author-microblog__post-delete-btn">
                                Удалить
                            </button>
                        </form>
                    </div>

                    <form th:action="@{/authors/posts/{postId}/edit(postId=${post.id})}"
                          th:if="${isOwner}"
                          method="post"
                          class="author-microblog__post-edit-form"
                          sec:authorize="isAuthenticated()">
                        <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="authorId" th:value="${post.author.id}">
                        <input type="text"
                               name="title"
                               th:value="${post.title}"
                               class="author-microblog__post-edit-title"
                               placeholder="Заголовок">
                        <textarea name="text"
                                  class="author-microblog__post-edit-text"
                                  required th:text="${post.text}"
                                  placeholder="Напиши хоть что-то, нельзя оставлять пост пустым!"  ></textarea>
                        <button type="submit" class="author-microblog__post-edit-submit">Сохранить</button>
                    </form>

                    <div class="post-comments-section">
                        <div class="post-comments-section__wrapper">
                            <h2>Комментарии</h2>
                        </div>
                        <form th:action="@{/authors/posts/{postId}/comments(postId=${post.id})}"
                              method="post"
                              class="author-microblog__post-comment-form"
                              sec:authorize="isAuthenticated()">
                            <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="authorId" th:value="${author.id}"/>
                            <textarea name="text"
                                      class="author-microblog__post-comment-text"
                                      required
                                      placeholder="Что думаете об этой записи?"></textarea>
                            <button type="submit" class="author-microblog__post-comment-submit">Оставить комментарий</button>
                        </form>
                        <p class="post-comments-section__login-prompt" sec:authorize="isAnonymous()">
                            Чтобы оставить комментарий, <a th:href="@{/login}">войдите в аккаунт</a>.
                        </p>
                        <div class="post-comments-list">
                            <div th:each="rootNode: ${postCommentTrees[post.id]}">
                                <div th:replace="~{fragments/comment :: postCommentNode(${rootNode}, ${post.id}, ${author.id})}"></div>
                            </div>
                            <p class="post-comments-list__empty" th:if="${post.comments == null || post.comments.isEmpty()}">
                                Комментариев пока нет - будь первым!
                            </p>
                        </div>
                    </div>

                </div>
                <div th:unless="${!posts.isEmpty() && posts != null}"
                     class="author-microblog__empty">
                    <p><span th:text="${author.firstName}+' '+${author.lastName}"></span> пока не опубликовал ни одной записи.
                        Подпишитесь, чтобы узнать о новых заметках автора!</p>
                </div>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/layout::footer(hero=false)}"></footer>
</div>

<div id="imageModal" class="image-modal">
    <span class="image-modal__close">&times;</span>
    <img class="image-modal__content" id="modalImage" alt="Полноразмерная аватарка">
</div>
</body>
</html>
