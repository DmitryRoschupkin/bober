<!DOCTYPE html>
<html   xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org"
        lang="en">
<head>
    <meta charset="UTF-8">
    <title>Редактировать профиль</title>
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/listing.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
    <script th:src="@{/js/header.js}" defer></script>
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/layout :: header(hero=false)}"></header>

    <div class="profile-edit">
        <h1 class="page__title">Редактируемся</h1>
        <a th:if="${user.role == 'USER'}" th:href="@{/become-author}" class="avg-link">Стать автором!</a>

        <div class="form-security__container profile-edit__container">
            <form th:action="@{/account/edit/{id}(id=${user.id})}"
                  th:object="${user}"
                  method="post"
                  class="form-security__form"
                  enctype="multipart/form-data">
                <div class="profile-edit__field" th:each="field : ${fieldNames}">
                    <label class="profile-edit__label" th:if="!${field == 'userPicturePath'}" th:text="${field}" th:for="${field}"></label>
                    <input th:if="${#strings.contains(field, 'birthDate')}"
                           type="date"
                           th:id="${field}"
                           th:field="*{__${field}__}"
                           class="form-security__input">
                    <label class="profile-edit__label" th:if="${#strings.contains(field, 'userPicturePath')}">Текущая аватарка: </label>
                    <div th:if="${#strings.contains(field, 'userPicturePath')}">
                        <img    th:if="${user.userPicturePath}"
                                th:src="@{/files/{path}(path=${user.userPicturePath})}"
                                alt="userpic"
                                style="max-width: 300px; border-radius: 4px;">
                        <span th:unless="${user.userPicturePath}">Аватарка отсутствует</span>
                    </div>
                    <label class="profile-edit__label" th:if="${#strings.contains(field, 'userPicturePath')}">Загрузить аватарку: </label>
                    <input th:if="${#strings.contains(field, 'userPicturePath')}"
                           type="file"
                           id="userPictureFile"
                           name="userPictureFile"
                           class="form-security__input"
                           accept="/image/*">
                    <input th:if="${!#strings.contains(field, 'birthDate') && !#strings.contains(field, 'userPicturePath')}"
                           type="text"
                           th:id="${field}"
                           th:field="*{__${field}__}"
                           class="form-security__input">
                </div>

                <button type="submit" class="form-security__button">Сохранить изменения</button>
            </form>

            <a th:href="@{/account/{id}(id=${user.id})}" class="profile-edit__cancel">Отмена</a>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer(hero=false)}"></footer>
</div>
</body>
</html>
