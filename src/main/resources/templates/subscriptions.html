<!DOCTYPE html>
<html   xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
        lang="en">
<head>
    <meta charset="UTF-8">
    <title>Подписки</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/listing.css}">
    <link rel="stylesheet" th:href="@{/css/subscriptions.css}">
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <script th:src="@{/js/header.js}" defer></script>
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/layout::header(hero=false)}"></header>

    <h1 class="page__title">Подписки</h1>

    <div th:if="${!subscribedAuthors.isEmpty()}" class="subscriptions-layout">

        <div class="subscriptions-fresh">
            <p class="section-label">Свежее за неделю</p>

            <div class="subscriptions-fresh__card" th:each="entry : ${recentBooksByAuthor}">
                <p class="subscriptions-fresh__author"
                   th:text="${entry.key.firstName}+' '+
                           ${entry.key.lastName}+' ('+
                           ${entry.value.size()}+' '+
                           ${entry.key.getWordCase(entry.value.size())}+')'">Кто написал этот текст?</p>
                <ul class="subscriptions-fresh__books">
                    <li th:each="book: ${entry.value}">
                        <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}"></a>
                    </li>
                </ul>
            </div>

            <p class="subscriptions-empty" th:if="${recentBooksByAuthor.isEmpty()}" style="padding: 0; text-align: left;">
                За последнюю неделю ничего нового у отслеживаемых авторов не выходило.
            </p>
        </div>

        <div class="subscriptions-list">
            <p class="section-label">Мои подписки</p>

            <div class="subscriptions-list__item" th:each="author: ${subscribedAuthors}">
                <a th:href="@{/authors/{id}(id=${author.id})}"
                   th:text="${author.firstName}+' '+${author.lastName}"></a>
                <form th:action="@{/subscriptions/{id}/unsubscribe(id=${author.id})}" method="post">
                    <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="subscriptions-list__unsub">Отписаться</button>
                </form>
            </div>
        </div>

    </div>

    <div th:unless="${!subscribedAuthors.isEmpty()}" class="subscriptions-empty">
        <p>Вы пока не подписаны ни на одного автора</p>
        <a th:href="@{/authors}">К авторам!</a>
    </div>

    <footer th:replace="~{fragments/layout::footer(hero=false)}"></footer>
</div>
</body>
</html>
