<!DOCTYPE html>
<html   xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
        lang="en">
<head>
    <meta charset="UTF-8">
    <title>Подписки</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/listing.css}">
    <link rel="stylesheet" th:href="@{/css/subscriptions.css}">
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script th:src="@{/js/header.js}" defer></script>
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/layout::header(hero=false)}"></header>

    <h1 class="page__title">Подписки</h1>

    <div th:if="${!subscribedAuthors.isEmpty()}" class="subscriptions-layout">

        <div class="subscriptions-fresh">
            <p class="section-label">Новые публикации за неделю</p>

            <div class="subscriptions-fresh__card" th:each="entry : ${recentBooksByAuthor}">
                <p class="subscriptions-fresh__author"
                   th:text="${entry.key.firstName}+' '+
                           ${entry.key.lastName}+' ('+
                           ${entry.value.size()}+' '+
                           ${entry.key.getWordCase(entry.value.size())}+')'">Кто написал этот текст?</p>
                <ul class="subscriptions-fresh__books">
                    <li th:each="book: ${entry.value}">
                        <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}"></a>
                    </li>
                </ul>
            </div>

            <p class="subscriptions-empty" th:if="${recentBooksByAuthor.isEmpty()}" style="padding: 0; text-align: left;">
                За последнюю неделю ничего нового у отслеживаемых авторов не выходило.
            </p>

            <p class="section-label">Записи на страницах авторов за последние три дня</p>

            <div class="author-microblog__posts-listing" th:each="entry: ${recentPostsByAuthor}">
                <div class="author-microblog__post"
                     th:each="post: ${entry.value}"
                     th:if="${not #lists.isEmpty(entry.value)}"
                     th:with="author = ${entry.key}">
                    <div class="author-microblog__post-metadata">
                        <p th:text="${author.firstName+' '+author.lastName}"
                           class="author-microblog__post-fullname"></p>
                    </div>
                    <a th:href="@{/authors/{authorId}(authorId=${author.id}, postId=${post.id})} + '#post-' + ${post.id}"
                       style="text-decoration: none">
                        <p th:if="${post.title != null && !post.title.isBlank()}"
                           th:text="${post.title}"
                           class="author-microblog__post-title"></p>
                        <p th:text="${post.text}"
                           class="author-microblog__post-text"></p>
                    </a>
                    <div class="author-microblog__post-marks">
                        <form th:action="@{/authors/{id}/post/mark(id=${author.id})}" method="post">
                            <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="isLike" value="true">
                            <input type="hidden" name="postId" th:value="${post.id}">
                            <button type="submit"
                                    class="author-microblog__post-mark post-btn-like"
                                    th:disabled="${currentUser == null}"
                                    th:classappend="${userPostMarks != null && userPostMarks[post.id] == true ? 'active' : ''}">
                                <i class="fa-solid fa-thumbs-up"></i>
                                <span class="author-microblog__post-marks-count"
                                      th:text="${post.likesCount ?: 0}">0</span>
                            </button>
                        </form>
                        <form th:action="@{/authors/{id}/post/mark(id=${author.id})}" method="post">
                            <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="isLike" value="false">
                            <input type="hidden" name="postId" th:value="${post.id}">
                            <button type="submit"
                                    class="author-microblog__post-mark post-btn-dislike"
                                    th:disabled="${currentUser == null}"
                                    th:classappend="${userPostMarks != null && userPostMarks[post.id] == false ? 'active' : ''}">
                                <i class="fa-solid fa-thumbs-down"></i>
                                <span class="author-microblog__post-marks-count"
                                      th:text="${post.dislikesCount ?: 0}">0</span>
                            </button>
                        </form>
                        <div class="author-microblog__post-date">
                            <p class="author-microblog__post-created"
                               th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}"></p>
                            <p  class="author-microblog__post-updated"
                                th:if="${post.updatedAt != null &&
                                    post.updatedAt != post.createdAt}"
                                th:title="${#temporals.format(post.updatedAt, 'dd.MM.yyyy HH:mm')}"
                                th:text="'(изменено)'"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="subscriptions-list">
            <p class="section-label">Мои подписки</p>

            <div class="subscriptions-list__item" th:each="author: ${subscribedAuthors}">
                <a th:href="@{/authors/{id}(id=${author.id})}"
                   th:text="${author.firstName}+' '+${author.lastName}"></a>
                <form th:action="@{/subscriptions/{id}/unsubscribe(id=${author.id})}" method="post">
                    <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="subscriptions-list__unsub">Отписаться</button>
                </form>
            </div>
        </div>

    </div>

    <div th:unless="${!subscribedAuthors.isEmpty()}" class="subscriptions-empty">
        <p>Вы пока не подписаны ни на одного автора</p>
        <a th:href="@{/authors}">К авторам!</a>
    </div>

    <footer th:replace="~{fragments/layout::footer(hero=false)}"></footer>
</div>
</body>
</html>
