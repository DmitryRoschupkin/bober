<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.title}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/listing.css}">
    <link rel="stylesheet" th:href="@{/css/comment.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script th:src="@{/js/header.js}" defer></script>
    <script th:src="@{/js/comment.js}" defer></script>
    <script th:src="@{/js/image-modal.js}" defer></script>
</head>
<body>
<div class="page">
    <header th:replace="~{fragments/layout::header(hero=false)}"></header>

    <div class="book-detail">
        <div class="book-detail__cover">
            <img th:if="${book.coverPath}"
                 th:src="@{/files/{path}(path=${book.coverPath})}"
                 th:alt="${book.title}"
                 class="book-cover-img" />
            <!-- default cover will be designed soon -->
            <img th:unless="${book.coverPath}"
                 th:src="@{/img/default-cover.png}"
                 alt="No cover"
                 class="book-cover-img" />
        </div>
        <div>
            <h1 class="book-detail__title" th:text="${book.title}"></h1>

            <p class="book-detail__authors">
                    <span th:each="author, iter:${book.authors}">
                        <a th:href="@{/authors/{id}(id=${author.id})}"
                           th:text="${author.firstName} + ' ' + ${author.lastName ?: ''}"></a>
                        <span th:if="${!iter.last}">,</span>
                    </span>
                    <span class="book-detail__coauthors" th:if="${book.coauthors != null && !book.coauthors.isBlank()}">
                        <span th:if="${!book.authors.isEmpty()}">, </span>
                        <span th:text="${book.coauthors}"></span>
                    </span>
            </p>

            <div class="book-detail__meta">
                <span th:if="${book.genre}" th:text="${book.genre}"></span>
                <span th:if="${book.year}" th:text="${book.year}"></span>
                <span th:if="${book.publisher}" th:text="${book.publisher}"></span>
            </div>

            <p class="book-detail__description" th:text="${book.description}"></p>

            <div class="book-detail__marks">
                <form th:action="@{/books/{id}/mark(id=${book.id})}" method="post">
                    <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="type" value="LIKE" />
                    <button type="submit"
                            class="book-detail__mark btn-like"
                            th:classappend="${userMark == 'LIKE'} ? 'active' : ''"
                            th:disabled="${currentUser == null}">
                        <i class="fa-solid fa-thumbs-up"></i>
                        <span class="book-detail__marks-count" th:text="${book.likesCount ?: 0}">0</span>
                    </button>
                </form>
                <form th:action="@{/books/{id}/mark(id=${book.id})}" method="post">
                    <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="type" value="DISLIKE" />
                    <button type="submit"
                            class="book-detail__mark btn-dislike"
                            th:classappend="${userMark == 'DISLIKE'} ? 'active' : ''"
                            th:disabled="${currentUser == null}">
                        <i class="fa-solid fa-thumbs-down"></i>
                        <span class="book-detail__marks-count" th:text="${book.dislikesCount ?: 0}">0</span>
                    </button>
                </form>
            </div>

            <div class="book-detail__actions">
                <a sec:authorize="isAuthenticated()"
                   th:href="@{/books/{id}/download(id=${book.id})}"
                   class="book-detail__actions-btn">
                    Скачать книгу ([[${#strings.toUpperCase(book.fileFormat)}]])
                </a>
                <a th:if="${book.authors.contains(author)}"
                   th:href="@{/authors/books/edit/{id}(id=${book.id})}"
                   class="book-detail__actions-btn">
                    Редактировать
                </a>
                <form th:if="${book.authors.contains(author)}"
                      th:action="@{/books/delete/{id}(id=${book.id})}" method="post"
                      onsubmit="return confirm('Вы уверены, что хотите удалить эту книгу?');">
                    <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="book-detail__actions-btn-delete" type="submit">Удалить</button>
                </form>
                <div sec:authorize="isAnonymous()" class="download-login-prompt">
                    <p>Чтобы скачать книгу, <a th:href="@{/login}">войдите в аккаунт</a>.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="page comments-section">
        <div class="comments-section__title-wrapper">
            <h2 class="page__title">Комментарии</h2>
            <h2 class="page__title" th:text="'('+${commentsAmount}+')'"></h2>
        </div>
        <div class="form-security__container" sec:authorize="isAuthenticated()">
            <form th:action="@{/books/{id}/comments(id=${book.id})}"
                  class="form-security__form"
                  method="post">
                <input th:if="${_csrf}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <textarea name="text" class="form-security__input" placeholder="Что думаете?" rows="3" required></textarea>
                <button type="submit" class="form-security__button">Оставить комментарий</button>
            </form>
        </div>
        <p class="comments-section__login-prompt" sec:authorize="isAnonymous()">
            Чтобы оставить комментарий, <a th:href="@{/login}">войдите в аккаунт</a>.
        </p>
        <div class="comments-list">
            <div th:each="root : ${comments}">
                <div th:replace="~{fragments/comment :: commentNode(${root}, ${book.id})}"></div>
            </div>

            <p class="comments-list__empty" th:if="${comments == null or comments.isEmpty()}">
                Комментариев пока нет - будь первым
            </p>
        </div>
    </div>

    <footer th:replace="~{fragments/layout::footer(hero=false)}"></footer>
</div>
<div id="imageModal" class="image-modal">
    <span class="image-modal__close">&times;</span>
    <img class="image-modal__content" id="modalImage" alt="Полноразмерная аватарка">
</div>
</body>
</html>
